name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  # Own group (not shared with the PR preview workflows), so only an older
  # pending publish is ever replaced, by a newer one. Concurrent preview
  # pushes are handled by force: false below.
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          REACT_APP_METERED_API_KEY: ${{ secrets.METERED_API_KEY }}
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          # Keep PR previews (managed by preview-deploy.yml / preview-cleanup.yml).
          clean-exclude: |
            pr-preview/
          # Rebase onto concurrent preview deployments instead of overwriting them.
          force: false
