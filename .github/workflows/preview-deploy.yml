name: PR Preview Deploy

# Phase 2 of the PR preview. Triggered by workflow_run, so it always runs the
# workflow file from main (which PRs can't modify) and gets a write token.
#
# It must never execute anything from the PR: the artifact is treated as
# untrusted data and only copied into gh-pages/pr-preview/pr-<number>/.

on:
  workflow_run:
    workflows: [PR Preview Build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  # Shared with publish.yml and preview-cleanup.yml so pushes to gh-pages
  # never race each other.
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy preview
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PR
        id: pr
        # The PR number comes from the artifact, so it is untrusted: check it
        # is a number, and that the PR is open and its head is the exact
        # commit phase 1 built.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_DIR: ${{ runner.temp }}/preview
        run: |
          number="$(head -c 16 "$PREVIEW_DIR/pr-number" | tr -d '[:space:]')"
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number in artifact"
            exit 1
          fi
          read -r state sha < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '"\(.state) \(.head.sha)"')
          if [ "$sha" != "$HEAD_SHA" ]; then
            echo "::error::PR #$number head ($sha) does not match the built commit ($HEAD_SHA)"
            exit 1
          fi
          if [ "$state" != "open" ]; then
            echo "PR #$number is $state, skipping deployment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != 'true'
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish to gh-pages
        if: steps.pr.outputs.skip != 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_DIR: ${{ runner.temp }}/preview
        working-directory: gh-pages
        run: |
          dest="pr-preview/pr-$NUMBER"
          # Drop symlinks and any .git dir from the untrusted artifact.
          find "$PREVIEW_DIR/site" -type l -delete
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R "$PREVIEW_DIR/site/." "$dest/"
          rm -rf "$dest/.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$dest"
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -q -m "Deploy preview for PR #$NUMBER ($HEAD_SHA)"
          for i in 1 2 3 4; do
            git push origin gh-pages && exit 0
            sleep $((2 ** i))
            git pull --rebase origin gh-pages
          done
          exit 1

      - name: Comment preview link
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          url="https://www.predatorray.me/rendezvous/pr-preview/pr-$NUMBER/"
          body="$(printf '%s\n' \
            '<!-- pr-preview -->' \
            "🚀 **Preview deployed:** $url" \
            '' \
            "Built from $HEAD_SHA. GitHub Pages may take a minute or two to update." \
            '' \
            'The preview is removed when this PR is closed.')"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-preview -->"))) | .id' | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body" > /dev/null
          fi
